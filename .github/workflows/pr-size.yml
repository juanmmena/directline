name: PR Size

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write
  issues: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  label-pr-size:
    name: Label PR Size
    runs-on: ubuntu-latest

    steps:
      - name: Calculate PR size and apply label
        uses: actions/github-script@v9
        with:
          script: |
            const ignoredPatterns = [
              /^gradle\/wrapper\//,
              /\.webp$/,
              /\.png$/,
              /\.jpg$/,
              /\.jar$/,
              /^app\/schemas\//,
            ];

            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
              per_page: 100,
            });

            const totalChanges = files
              .filter((f) => !ignoredPatterns.some((re) => re.test(f.filename)))
              .reduce((sum, f) => sum + f.additions + f.deletions, 0);

            const sizeConfig = [
              { name: 'size/XS', max: 50, color: '0E8A16', desc: 'Extra small PR (<= 50 lines)' },
              { name: 'size/S', max: 200, color: '5319E7', desc: 'Small PR (51-200 lines)' },
              { name: 'size/M', max: 500, color: 'FBCA04', desc: 'Medium PR (201-500 lines)' },
              { name: 'size/L', max: 1000, color: 'D93F0B', desc: 'Large PR (501-1000 lines)' },
              { name: 'size/XL', max: Infinity, color: 'B60205', desc: 'Extra large PR (> 1000 lines)' },
            ];

            const target = sizeConfig.find((s) => totalChanges <= s.max);

            // Ensure target label exists
            try {
              await github.rest.issues.getLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                name: target.name,
              });
            } catch (err) {
              if (err.status === 404) {
                await github.rest.issues.createLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  name: target.name,
                  color: target.color,
                  description: target.desc,
                });
              } else {
                throw err;
              }
            }

            // Remove any outdated size/* labels
            const { data: currentLabels } = await github.rest.issues.listLabelsOnIssue({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            for (const label of currentLabels) {
              if (label.name.startsWith('size/') && label.name !== target.name) {
                await github.rest.issues.removeLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: context.issue.number,
                  name: label.name,
                });
              }
            }

            if (!currentLabels.some((l) => l.name === target.name)) {
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                labels: [target.name],
              });
            }

            core.summary
              .addHeading('PR Size Summary')
              .addRaw(`Changed lines (excluding generated/binary assets): **${totalChanges}** → \`${target.name}\``)
              .write();

            if (target.name === 'size/XL') {
              core.warning(
                `This PR changes ${totalChanges} lines (${target.name}). Consider splitting it into smaller, focused PRs.`
              );
            }
